app-id: org.voiceink.VoiceInk
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: voiceink

finish-args:
  # GUI access
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

  # Audio access
  - --socket=pulseaudio

  # Network for cloud transcription
  - --share=network

  # Filesystem access for audio files
  - --filesystem=home

  # D-Bus for notifications, secrets, and tray
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.gnome.Shell

  # For hotkey support
  - --talk-name=org.freedesktop.portal.GlobalShortcuts

  # For clipboard and paste
  - --socket=session-bus

modules:
  # whisper.cpp
  - name: whisper-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DWHISPER_BUILD_EXAMPLES=OFF
      - -DWHISPER_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/ggerganov/whisper.cpp.git
        tag: v1.5.4
    post-install:
      - install -Dm644 libwhisper.so /app/lib/libwhisper.so

  # Python dependencies
  - name: python3-sounddevice
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app sounddevice
    sources: []

  - name: python3-numpy
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app numpy
    sources: []

  - name: python3-httpx
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app httpx
    sources: []

  - name: python3-keyring
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app keyring secretstorage
    sources: []

  # VoiceInk
  - name: voiceink
    buildsystem: meson
    sources:
      - type: dir
        path: .
