name: Linux CI

on:
  push:
    branches: [main, claude/*]
    paths:
      - 'voiceink-linux/**'
      - '.github/workflows/linux-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'voiceink-linux/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            meson \
            ninja-build

      - name: Build with Meson
        working-directory: voiceink-linux
        run: |
          meson setup build --prefix=/usr
          meson compile -C build

  build-deb:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper \
            devscripts \
            meson \
            ninja-build \
            python3-all \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Build Debian package
        working-directory: voiceink-linux
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceink-deb
          path: voiceink_*.deb

  build-flatpak:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Build Flatpak
        working-directory: voiceink-linux
        run: |
          flatpak-builder --user --force-clean build-flatpak org.voiceink.VoiceInk.yml

      - name: Bundle Flatpak
        working-directory: voiceink-linux
        run: |
          flatpak-builder --user --repo=repo --force-clean build-flatpak org.voiceink.VoiceInk.yml
          flatpak build-bundle repo voiceink.flatpak org.voiceink.VoiceInk

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceink-flatpak
          path: voiceink-linux/voiceink.flatpak

  release:
    runs-on: ubuntu-24.04
    needs: [build-deb, build-flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            voiceink-deb/*.deb
            voiceink-flatpak/*.flatpak
          generate_release_notes: true
